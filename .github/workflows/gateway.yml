name: Gateway checks
on:
  pull_request:
  push:
    branches: [main, codex/mahatva-gateway]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build --workspace @leakshield/web
      - run: node eval/validate.mjs eval/contributions/mahatva/dev.jsonl eval/contributions/mahatva/heldout.jsonl
      - run: npm audit --omit=dev
